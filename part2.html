<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 4 - Part 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Forms and Validation</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link" href="index.html">Part 1</a>
            <a class="nav-link active" href="part2.html">Part 2</a>
            <a class="nav-link" href="part3.html">Part 3</a>
        </div>
    </div>
</nav>

<div class="container">
    <h1>Bootstrap Forms</h1>

    <h3 class="mt-4">Styled Form</h3>

    <form style="max-width: 500px;">
        <div class="mb-3">
            <label for="nameInput" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="nameInput" placeholder="Enter your name" required>
        </div>

        <div class="mb-3">
            <label for="emailInput" class="form-label">Email address</label>
            <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" required>
            <div class="form-text">We'll never share your email with anyone else.</div>
        </div>

        <div class="mb-3">
            <label for="msgInput" class="form-label">Message</label>
            <textarea class="form-control" id="msgInput" rows="3" placeholder="Write something..." required></textarea>
        </div>

        <button type="submit" class="btn btn-success">Send Message</button>
    </form>
</div>

</body>
</html>
