<div class="container">
  <h1>Basic HTML Forms</h1>

  <h3 class="mt-4">Task 1: Contact Form</h3>
  <form style="max-width: 500px;">
    <div class="mb-3">
      <label for="userName">Name:</label>
      <input type="text" id="userName" name="userName" required class="form-control">
    </div>

    <div class="mb-3">
      <label for="userEmail">Email:</label>
      <input type="email" id="userEmail" name="userEmail" required class="form-control">
    </div>

    <div class="mb-3">
      <label for="userMessage">Message:</label>
      <textarea id="userMessage" name="userMessage" rows="4" maxlength="300" required class="form-control"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>

</body>
