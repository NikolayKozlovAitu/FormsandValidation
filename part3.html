<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 4 - Part 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Forms and Validation</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link" href="index.html">Part 1</a>
            <a class="nav-link" href="part2.html">Part 2</a>
            <a class="nav-link active" href="part3.html">Part 3</a>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <h1>Registration Form</h1>

    <form class="mt-4" style="max-width: 600px;">
        <div class="row g-3">

            <div class="col-md-6">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" required>
            </div>
            <div class="col-md-6">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" required>
            </div>

            <div class="col-12">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>

            <div class="col-md-6">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" minlength="6" required>
            </div>
            <div class="col-md-6">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" minlength="6" required>
            </div>

            <div class="col-12">
                <label class="form-label d-block">Gender</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>
                    <label class="form-check-label" for="male">Male</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="female" value="female" required>
                    <label class="form-check-label" for="female">Female</label>
                </div>
            </div>

            <div class="col-12">
                <label class="form-label d-block">Hobbies</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="sports">
                    <label class="form-check-label" for="sports">Sports</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="music">
                    <label class="form-check-label" for="music">Music</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="gaming">
                    <label class="form-check-label" for="gaming">Gaming</label>
                </div>
            </div>

            <div class="col-12">
                <label for="country" class="form-label">Country</label>
                <select class="form-select" id="country" required>
                    <option value="">Choose...</option>
                    <option value="KZ">Kazakhstan</option>
                    <option value="US">USA</option>
                    <option value="UK">UK</option>
                </select>
            </div>

            <div class="col-12 mt-4">
                <button class="btn btn-primary me-2" type="submit">Submit</button>
                <button class="btn btn-secondary" type="reset">Reset</button>
            </div>

        </div>
    </form>
</div>

</body>
</html>
